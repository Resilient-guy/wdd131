<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="150" height="200">
  <!-- Sun with border -->
  <circle cx="80" cy="60" r="20" fill="#FFD700" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- 8 solid rays around the sun -->
  <line x1="80" y1="30" x2="80" y2="15" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="90" x2="80" y2="105" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="35" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="60" x2="125" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="57" y1="37" x2="47" y2="27" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="103" y1="83" x2="113" y2="93" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="103" y1="37" x2="113" y2="27" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="57" y1="83" x2="47" y2="93" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cloud -->
  <ellipse cx="50" cy="115" rx="30" ry="25" fill="#D3D3D3" stroke="#999" stroke-width="2"/>
  <ellipse cx="80" cy="110" rx="35" ry="30" fill="#D3D3D3" stroke="none"/>
  <ellipse cx="110" cy="115" rx="30" ry="25" fill="#D3D3D3" stroke="#999" stroke-width="2"/>
  
  <!-- Top curve border of cloud -->
  <!-- <path d="M 30 115 Q 80 85 130 115" fill="none" stroke="#999" stroke-width="2"/> -->
  
  <!-- Rain drops (dotted) -->
  <circle cx="55" cy="145" r="2" fill="#4A90E2"/>
  <circle cx="75" cy="150" r="2" fill="#4A90E2"/>
  <circle cx="95" cy="145" r="2" fill="#4A90E2"/>
  <circle cx="65" cy="160" r="2" fill="#4A90E2"/>
  <circle cx="85" cy="165" r="2" fill="#4A90E2"/>
  <circle cx="105" cy="160" r="2" fill="#4A90E2"/>
